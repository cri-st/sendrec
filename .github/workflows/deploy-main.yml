name: Build and Push Image (main)

# Publishes the sendrec image to GHCR after CI passes on main, so a
# self-hosted Dokploy instance can pull ghcr.io/<owner>/sendrec:latest
# instead of the upstream image. Gated on CI success so we never ship
# an image built from a commit that failed tests.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sendrec:latest
            ghcr.io/${{ github.repository_owner }}/sendrec:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: set a DOKPLOY_DEPLOY_WEBHOOK repo secret (copy the
      # "Deploy Webhook" URL from the sendrec service in Dokploy) to
      # auto-redeploy after each successful push. Skipped if unset.
      - name: Trigger Dokploy redeploy
        if: ${{ env.DOKPLOY_DEPLOY_WEBHOOK != '' }}
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
